[project]
name = "dbs-finance"
version = "0.1.0"
description = "Fill an Excel expense tracker from DBS bank exports, with Claude naming the merchants"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pywin32>=306; sys_platform == 'win32'"]

[project.scripts]
finance = "finance.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Excel's COM server raises a handled exception on close; faulthandler would print it as fatal
addopts = "-p no:faulthandler"
